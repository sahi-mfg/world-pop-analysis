[project]
name = "world-pop-analysis"
version = "0.3.0"
description = "Async client, analytics, API and web dashboard for WorldPop gridded population estimates."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sahi Mohamed Francis Gonsangbeu" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pandas>=2.2.3",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Offline data pipeline (rasters -> JSON for the static site); not needed by the API image.
pipeline = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "scipy>=1.14",
    "shapely>=2.0",
]

[project.scripts]
worldpop = "worldpop_analysis.cli:main"
worldpop-api = "worldpop_analysis.api:main"
worldpop-pipeline = "worldpop_analysis.pipeline.cli:main"
worldpop-buildings = "worldpop_analysis.pipeline.cli:main_buildings"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldpop_analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
