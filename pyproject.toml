[project]
name = "world-pop-analysis"
version = "0.2.0"
description = "Async client, analytics and Streamlit dashboard for WorldPop gridded population estimates."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sahi Mohamed Francis Gonsangbeu" }]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2.3",
    "streamlit>=1.40.2",
]

[project.scripts]
worldpop = "worldpop_analysis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldpop_analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
